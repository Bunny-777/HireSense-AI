[project]
name = "hiresense-ai"
version = "0.1.0"
description = "Voice-based AI interview agent with live audio, ASR, and follow-up generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=2.39.0",
    "httpx>=0.28.1",
    "numpy>=2.4.3",
    "python-dotenv>=1.2.2",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]

[project.scripts]
hiresense-live = "hiresense_ai.interview.live_voice:main"
allystack-live = "hiresense_ai.interview.live_voice:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
